[package]
name = "spoticry-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5" # NECESARIO para ServiceExt (oneshot)
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

im = { version = "15", features = ["serde"] }
arc-swap = "1"

id3 = "1"

reqwest = { version = "0.12", features = ["json", "stream"] }

rspotify = { version = "0.13", features = ["client-reqwest", "reqwest-rustls-tls"], default-features = false }

uuid = { version = "1", features = ["v4", "serde"] }

anyhow = "1"
thiserror = "1"

dashmap = "6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

futures = "0.3"
bytes = "1"

once_cell = "1.21.4"

dotenvy = "0.15"

[[bin]]
name = "spoticry-server"
path = "src/main.rs"